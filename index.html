<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词汇小课</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f1;color:#25352d;font:17px system-ui}main{max-width:850px;margin:auto;padding:28px 18px}h1{font-size:32px;margin:12px 0}h2{font-size:22px}p{line-height:1.65;color:#627168}.tag{color:#538266;letter-spacing:.15em;font-size:13px;font-weight:bold}section{background:white;border:1px solid #e0e8df;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #243c2610}button,.button{border:0;background:#416f54;color:white;border-radius:10px;padding:13px 18px;font:inherit;cursor:pointer;margin:4px}button.secondary{background:#edf3ed;color:#355841}button:disabled{opacity:.45}input,textarea{font:inherit}textarea{width:100%;min-height:240px;border:1px solid #cad9cc;border-radius:10px;padding:12px;line-height:1.6}select{padding:10px;border:1px solid #cad9cc;border-radius:8px;font:inherit}.choices{display:grid;gap:10px}.choices button{text-align:left;background:#f2f6f2;color:#263c2d;margin:0}.choices button:hover{background:#e0ede1}.word{font-size:32px;font-weight:700;margin:25px 0}.result{padding:14px;background:#eef5eb;border-radius:10px;line-height:1.6}.muted{font-size:14px;color:#748477}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}progress{width:100%;accent-color:#5d9470}nav button{font-size:15px}.hidden{display:none}label{display:inline-block} @media(max-width:500px){section{padding:18px}.word{font-size:26px}}
</style><main><div class="tag">A LITTLE EVERY DAY</div><h1>词汇小课 🌿</h1><p>先找到不熟悉的词，再把时间留给真正需要练习的地方。</p><nav><button onclick="show('library')">词库</button><button class="secondary" onclick="show('quiz')">开始测试</button><button class="secondary" onclick="show('review')">待背词</button><button class="secondary" onclick="show('backup')">备份</button></nav>
<section id="library"><h2>导入词库</h2><p>上传 PDF、Excel、CSV 或 TXT，检查并修改提取结果后保存。每行一组，英文和中文之间用空格或制表符分隔，最多 500 条。</p><input id="file" type="file" accept=".pdf,.xlsx,.xls,.csv,.txt"><button onclick="importFile()">提取词汇</button><p id="importStatus" class="muted">PDF 需包含可选中的文字；扫描件暂不支持识别。</p><input id="name" placeholder="词库名称" style="padding:10px;width:100%;border:1px solid #cad9cc;border-radius:8px"><p></p><textarea id="editor" placeholder="例如：&#10;above all 首要地；最重要地&#10;by accident 意外地"></textarea><div class="row"><button onclick="saveDeck()">保存词库</button><button class="secondary" onclick="loadSample()">载入示例词库</button></div><hr><h2>我的词库</h2><div id="decks"></div></section>
<section id="quiz" class="hidden"><h2>词汇筛查</h2><div id="quizBody"></div></section><section id="review" class="hidden"><h2>待背词</h2><p>答错和选择“不知道”的词都会留在这里。复测答对后会移出待背词。</p><div class="row"><button onclick="startReview()">复测待背词</button><button class="secondary" onclick="downloadWrong()">导出待背词 TXT</button></div><div id="reviewBody"></div></section><section id="backup" class="hidden"><h2>备份学习记录</h2><p>记录保存在当前设备的当前浏览器中。清除浏览器数据、更换设备或浏览器可能丢失记录，建议定期下载备份。</p><button onclick="download('词汇小课备份.json',JSON.stringify(state,null,2))">下载完整备份</button><p>恢复备份会替换当前设备上的词库和进度。</p><input type="file" id="restore" accept=".json"><button class="secondary" onclick="restore()">恢复备份</button></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
let state;try{state=JSON.parse(localStorage.getItem('vocab-class-v1'))||{decks:[],active:null,session:null}}catch{state={decks:[],active:null,session:null}};function persist(){localStorage.setItem('vocab-class-v1',JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==id));render()}function active(){return state.decks.find(d=>d.id===state.active)}function parse(text){return text.split(/\r?\n/).map(x=>x.trim().replace(/^\d+\s*[.、．]\s*/,'' )).filter(Boolean).map(x=>{let i=x.search(/[\u3400-\u9fff]/);return i>0?{en:x.slice(0,i).trim().replace(/[\s:：\t]+$/,''),zh:x.slice(i).trim()}:null}).filter(x=>x&&x.en&&x.zh)}
async function importFile(){let f=document.getElementById('file').files[0];if(!f)return alert('请先选择文件');let status=document.getElementById('importStatus');status.textContent='正在提取，请稍候…';try{let text='';if(/\.pdf$/i.test(f.name)){if(!window.pdfjsLib)throw Error('PDF 组件加载失败，请检查网络');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let n=1;n<=pdf.numPages;n++){let page=await pdf.getPage(n),content=await page.getTextContent(),items=content.items.filter(i=>i.str.trim()),width=page.getViewport({scale:1}).width;let cols=[items.filter(i=>i.transform[4]<width/2),items.filter(i=>i.transform[4]>=width/2)];for(let col of cols){let lines=[];for(let item of col){let y=item.transform[5],line=lines.find(l=>Math.abs(l.y-y)<3);if(!line)lines.push(line={y,items:[]});line.items.push(item)}lines.sort((a,b)=>b.y-a.y);text+=lines.map(l=>l.items.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')).join('\n')+'\n'}}}else if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX)throw Error('Excel 组件加载失败，请检查网络');let wb=XLSX.read(await f.arrayBuffer());text=wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:'\t'})).join('\n')}else text=await f.text();document.getElementById('editor').value=text;document.getElementById('name').value=f.name.replace(/\.[^.]+$/,'');status.textContent='提取完成。请检查每行，合并换行的释义，删除标题、页码等无关内容；系统识别到 '+parse(text).length+' 组。'}catch(e){status.textContent='提取失败：'+e.message}}
async function loadSample(){try{let r=await fetch('初始词库.txt');if(!r.ok)throw Error();document.getElementById('editor').value=await r.text();document.getElementById('name').value='高中必背词组 1–500';document.getElementById('importStatus').textContent='已载入示例，请检查后保存。'}catch{alert('请通过网站地址访问，或手动上传附带的初始词库.txt')}}
function saveDeck(){let words=parse(document.getElementById('editor').value),name=document.getElementById('name').value.trim()||'未命名词库';if(words.length<4)return alert('请至少输入 4 组词汇，每行包含英文和中文释义。');if(words.length>500)return alert('每组最多 500 条，目前识别到 '+words.length+' 条。');let d={id:Date.now().toString(),name,words,wrong:{}};state.decks.push(d);state.active=d.id;state.session=null;persist();render();alert('已保存 '+words.length+' 组词汇。')}
function selectDeck(id){state.active=id;state.session=null;persist();render()}function removeDeck(id){if(!confirm('删除此词库及其学习记录？'))return;state.decks=state.decks.filter(d=>d.id!==id);if(state.active===id){state.active=null;state.session=null}persist();render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(review=false){let d=active();if(!d)return alert('请先保存并选择一个词库');let ids=review?Object.keys(d.wrong).map(Number):d.words.map((_,i)=>i);if(!ids.length)return alert('当前没有待背词');state.session={deck:d.id,ids,index:0,review,answer:null,correct:0};persist();show('quiz')}function startReview(){start(true)}function choose(value){let s=state.session,d=active();if(!s||s.answer!==null)return;let idx=s.ids[s.index],w=d.words[idx],ok=value===w.zh;s.answer={value,ok};if(ok){s.correct++;if(s.review)delete d.wrong[idx]}else d.wrong[idx]={reason:value==='不知道'?'不知道':'答错'};persist();render()}function next(){let s=state.session;s.index++;s.answer=null;persist();render()}
function render(){let d=active();document.getElementById('decks').innerHTML=state.decks.length?state.decks.map(x=>`<p><strong>${esc(x.name)}</strong> · ${x.words.length} 组 · 待背 ${Object.keys(x.wrong).length} 个 ${x.id===state.active?'（当前）':''}<br><button class="secondary" onclick="selectDeck('${x.id}')">选择</button><button class="secondary" onclick="removeDeck('${x.id}')">删除</button></p>`).join(''):'<p class="muted">还没有词库，先导入一组吧。</p>';let s=state.session,el=document.getElementById('quizBody');if(!d){el.innerHTML='<p>请先导入并选择词库。</p>';return}if(!s||s.deck!==d.id){el.innerHTML=`<p>当前词库：${esc(d.name)}，共 ${d.words.length} 组。</p><button onclick="start()">开始筛查</button>`}else if(s.index>=s.ids.length){el.innerHTML=`<p>本次完成 ${s.ids.length} 题，答对 ${s.correct} 题。当前待背 ${Object.keys(d.wrong).length} 组。</p><button onclick="show('review')">查看待背词</button><button class="secondary" onclick="start()">重新筛查</button>`}else{let idx=s.ids[s.index],w=d.words[idx];if(!s.options||s.optionIndex!==s.index){let others=shuffle([...new Set(d.words.map(x=>x.zh).filter(x=>x!==w.zh))]).slice(0,3);s.options=shuffle([w.zh,...others]);s.optionIndex=s.index;persist()}el.innerHTML=`<p class="muted">${esc(d.name)} · ${s.review?'待背复测':'首次筛查'} · ${s.index+1} / ${s.ids.length}</p><progress max="${s.ids.length}" value="${s.index}"></progress><div class="word">${esc(w.en)}</div><div class="choices">${s.options.map((x,i)=>`<button ${s.answer?'disabled':''} onclick="choose(state.session.options[${i}])">${esc(x)}</button>`).join('')}<button ${s.answer?'disabled':''} onclick="choose('不知道')">不知道</button></div>${s.answer?`<p class="result">${s.answer.ok?'✓ 回答正确':'正确释义：'+esc(w.zh)}${!s.answer.ok?' · 已加入待背词':''}</p><button onclick="next()">下一题 →</button>`:''}`}let keys=Object.keys(d.wrong);document.getElementById('reviewBody').innerHTML=`<p>当前词库：${esc(d.name)} · ${keys.length} 组待背</p>`+keys.map(i=>`<p><strong>${esc(d.words[i].en)}</strong>　${esc(d.words[i].zh)} <span class="muted">（${esc(d.wrong[i].reason)}）</span></p>`).join('')}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadWrong(){let d=active();if(!d)return alert('请先选择词库');download('待背词.txt',Object.keys(d.wrong).map(i=>d.words[i].en+'\t'+d.words[i].zh).join('\n'))}async function restore(){let f=document.getElementById('restore').files[0];if(!f)return alert('请选择备份文件');try{let data=JSON.parse(await f.text());if(!Array.isArray(data.decks))throw Error();if(!confirm('恢复将替换当前全部数据，继续吗？'))return;state=data;persist();render();alert('恢复成功')}catch{alert('备份文件无效')}}render();
</script></html>
